#! dart run flutter_launcher_icons:main -f flutter_launcher_icons.yaml

flutter_launcher_icons:
  image_path: "assets/logos/logo_mark.png"
  image_path_android: "assets/logos/logo_mark.png"
  image_path_ios: "assets/logos/logo_mark.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/logo_mark.png"
  ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

  linux:
    generate: true
